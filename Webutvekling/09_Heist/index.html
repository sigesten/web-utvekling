<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: grid;
            grid-template-columns: 1fr 2.5fr 0.5fr 1fr;
           grid-template-areas:
            "heat heat sus sus"
            "man    rififi  rififi bankjob"
           ;

        }

        section{
            display: grid;
            grid-template-columns: 1fr 2.5fr 0.5fr 1fr;
             grid-template-areas:
            "top top top top"
            ". . . ."
            "bottom bottom bottom bottom"
           ;
            height: 50vh;
            /* border: 5px solid red; */
            background-size:100%;
            background-size: cover;
            color: white;
            margin: 1px;
        }

        #p1{
            grid-area: bottom;

        }

        #p4{
            grid-area: bottom;
            
        }

        #one{
            grid-area: heat;
            background-image: url(bilder/heat.jpg);
            
        }
        #two{
            grid-area: sus;
            background-image: url(bilder/usualsuspects.jpg);
            background-position: center;
            
        }
        #tree{
            grid-area: man;
            background-image: url(bilder/insideman.jpg);
            background-position: center;
        }
        #four{
            grid-area: rififi;
            background-image: url(bilder/rififi.jpg);
            background-position: center;
        }
        #five{
            grid-area: bankjob;
            background-image: url(bilder/bankjob.jpg);
            background-position: center;
        }
    </style>
</head>
<body>
    <section id="one"><p id="p1">Heat</p></section>
    <section id="two"><p id="p2">The Usual Suspects</p></section>
    <section id="tree"><p id="p3">Inside Man</p></section>
    <section id="four"><p id="p4">Rififi</p></section>
    <section id="five"><p id="p5">The Bankjob</p></section>
   
</body>
</html>
